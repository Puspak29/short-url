services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: short-url-app
    ports:
      - "8000:8000"
    env_file:
      - .env.test.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  node_modules:
  mongo_data:
  redis_data: